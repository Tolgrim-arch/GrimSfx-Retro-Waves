<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrimSfx - Retro Waves</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="min-h-screen flex flex-col">
  <!-- Header -->
  <header class="border-b border-[#1e2233] bg-[#0b0d14]/90 backdrop-blur sticky top-0 z-30">
    <div class="max-w-[1440px] mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3.5">
        <div class="w-10 h-10 rounded-lg bg-cyan-500/15 border border-cyan-400/40 flex items-center justify-center text-cyan-400 font-mono-tech font-bold text-sm">
          FX
        </div>
        <div>
          <h1 class="font-mono-tech text-lg sm:text-xl font-bold tracking-tight text-white" data-i18n="app.title"></h1>
          <p class="text-xs sm:text-sm text-slate-400 hidden sm:block" data-i18n="app.subtitle"></p>
        </div>
      </div>

      <div class="flex items-center gap-2.5">
        <span class="hidden md:inline-flex font-mono-tech text-xs px-3 py-1.5 rounded bg-[#161925] border border-[#252a3d] text-cyan-300" data-i18n="app.badge"></span>
        <button id="lang-toggle" type="button" class="btn-arcade font-mono-tech text-xs sm:text-sm px-3.5 py-1.5 rounded-lg bg-[#161925] hover:bg-[#1e2336] border border-[#2a3047] text-cyan-300">
          ES
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 max-w-[1440px] w-full mx-auto px-4 sm:px-6 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    <!-- Left Column: Presets, Waveform, Visualizer & Actions -->
    <aside class="lg:col-span-4 flex flex-col gap-5">
      <!-- CRT Oscilloscope -->
      <section class="bg-[#11131c] border border-[#1e2233] rounded-xl p-4 sm:p-5 flex flex-col gap-3.5">
        <h2 class="font-mono-tech text-xs sm:text-sm font-bold tracking-wider text-cyan-400" data-i18n="sections.visualizer"></h2>
        <div class="crt-screen rounded-lg border border-[#1e2233] h-36 sm:h-44 lg:h-48 w-full">
          <canvas id="oscilloscope" class="w-full h-full block"></canvas>
        </div>
        <!-- Primary Actions -->
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-2 gap-2.5 pt-1">
          <button id="btn-play" type="button" class="btn-arcade col-span-2 sm:col-span-1 lg:col-span-2 py-3 px-4 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-mono-tech font-bold text-sm tracking-wider shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2">
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <span data-i18n="app.play"></span> <span class="opacity-70 hidden sm:inline" data-i18n="app.playHint"></span>
          </button>
          <button id="btn-mutate" type="button" class="btn-arcade py-2.5 px-3 rounded-lg bg-[#161925] hover:bg-[#1e2336] border border-amber-500/40 text-amber-300 font-mono-tech text-xs sm:text-sm flex items-center justify-center gap-1.5">
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6 2.1-2.1"/></svg>
            <span data-i18n="app.mutate"></span>
          </button>
          <button id="btn-random" type="button" class="btn-arcade py-2.5 px-3 rounded-lg bg-[#161925] hover:bg-[#1e2336] border border-pink-500/40 text-pink-300 font-mono-tech text-xs sm:text-sm flex items-center justify-center gap-1.5">
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/></svg>
            <span data-i18n="app.randomize"></span>
          </button>
          <button id="btn-export" type="button" class="btn-arcade py-2.5 px-3 rounded-lg bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/40 text-emerald-300 font-mono-tech text-xs sm:text-sm flex items-center justify-center gap-1.5">
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span data-i18n="app.exportWav"></span>
          </button>
          <button id="btn-copy-json" type="button" class="btn-arcade py-2.5 px-3 rounded-lg bg-[#161925] hover:bg-[#1e2336] border border-[#2a3047] text-slate-300 font-mono-tech text-xs sm:text-sm flex items-center justify-center gap-1.5">
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span data-i18n="app.copyJson"></span>
          </button>
          <button id="btn-reset" type="button" class="btn-arcade col-span-2 py-2 px-3 rounded-lg bg-[#161925] hover:bg-red-950/40 border border-[#2a3047] hover:border-red-500/40 text-slate-400 hover:text-red-300 font-mono-tech text-xs sm:text-sm flex items-center justify-center gap-1.5">
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            <span data-i18n="app.reset"></span>
          </button>
        </div>
      </section>

      <!-- Presets -->
      <section class="bg-[#11131c] border border-[#1e2233] rounded-xl p-4 sm:p-5 flex flex-col gap-3.5">
        <h2 class="font-mono-tech text-xs sm:text-sm font-bold tracking-wider text-amber-400" data-i18n="sections.presets"></h2>
        <div class="grid grid-cols-2 gap-2.5">
          <button type="button" data-preset="pickup" class="preset-btn btn-arcade py-2.5 px-3 rounded-lg bg-[#161925] hover:bg-[#1e2336] border border-[#252a3d] hover:border-amber-400/50 text-xs sm:text-sm text-left flex items-center gap-2">
            <svg class="w-4 h-4 text-amber-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10.5h5"/></svg>
            <span data-i18n="presets.pickup"></span>
          </button>
          <button type="button" data-preset="laser" class="preset-btn btn-arcade py-2.5 px-3 rounded-lg bg-[#161925] hover:bg-[#1e2336] border border-[#252a3d] hover:border-amber-400/50 text-xs sm:text-sm text-left flex items-center gap-2">
            <svg class="w-4 h-4 text-cyan-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h16M15 7l5 5-5 5"/></svg>
            <span data-i18n="presets.laser"></span>
          </button>
          <button type="button" data-preset="explosion" class="preset-btn btn-arcade py-2.5 px-3 rounded-lg bg-[#161925] hover:bg-[#1e2336] border border-[#252a3d] hover:border-amber-400/50 text-xs sm:text-sm text-left flex items-center gap-2">
            <svg class="w-4 h-4 text-orange-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><polygon points="12 2 15 9 22 9 16.5 14 18.5 21 12 17 5.5 21 7.5 14 2 9 9 9"/></svg>
            <span data-i18n="presets.explosion"></span>
          </button>
          <button type="button" data-preset="powerup" class="preset-btn btn-arcade py-2.5 px-3 rounded-lg bg-[#161925] hover:bg-[#1e2336] border border-[#252a3d] hover:border-amber-400/50 text-xs sm:text-sm text-left flex items-center gap-2">
            <svg class="w-4 h-4 text-emerald-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 11 12 6 7 11"/><polyline points="17 18 12 13 7 18"/></svg>
            <span data-i18n="presets.powerup"></span>
          </button>
          <button type="button" data-preset="hit" class="preset-btn btn-arcade py-2.5 px-3 rounded-lg bg-[#161925] hover:bg-[#1e2336] border border-[#252a3d] hover:border-amber-400/50 text-xs sm:text-sm text-left flex items-center gap-2">
            <svg class="w-4 h-4 text-rose-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            <span data-i18n="presets.hit"></span>
          </button>
          <button type="button" data-preset="jump" class="preset-btn btn-arcade py-2.5 px-3 rounded-lg bg-[#161925] hover:bg-[#1e2336] border border-[#252a3d] hover:border-amber-400/50 text-xs sm:text-sm text-left flex items-center gap-2">
            <svg class="w-4 h-4 text-sky-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            <span data-i18n="presets.jump"></span>
          </button>
          <button type="button" data-preset="blip" class="preset-btn btn-arcade col-span-2 py-2.5 px-3 rounded-lg bg-[#161925] hover:bg-[#1e2336] border border-[#252a3d] hover:border-amber-400/50 text-xs sm:text-sm text-left flex items-center gap-2">
            <svg class="w-4 h-4 text-purple-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/></svg>
            <span data-i18n="presets.blip"></span>
          </button>
        </div>
      </section>

      <!-- Waveform Selector -->
      <section class="bg-[#11131c] border border-[#1e2233] rounded-xl p-4 sm:p-5 flex flex-col gap-3.5">
        <h2 class="font-mono-tech text-xs sm:text-sm font-bold tracking-wider text-cyan-400" data-i18n="sections.waveform"></h2>
        <div class="grid grid-cols-3 sm:grid-cols-5 lg:grid-cols-3 gap-2.5">
          <button type="button" data-wave="square" class="wave-btn btn-arcade py-2.5 px-2 rounded-lg bg-[#161925] border border-[#252a3d] text-xs sm:text-sm flex flex-col items-center gap-1">
            <svg class="w-5 h-4" viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12V4h8v8h8V4h4"/></svg>
            <span data-i18n="waveforms.square"></span>
          </button>
          <button type="button" data-wave="sawtooth" class="wave-btn btn-arcade py-2.5 px-2 rounded-lg bg-[#161925] border border-[#252a3d] text-xs sm:text-sm flex flex-col items-center gap-1">
            <svg class="w-5 h-4" viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12L10 4v8l8-8v8l4-4"/></svg>
            <span data-i18n="waveforms.sawtooth"></span>
          </button>
          <button type="button" data-wave="sine" class="wave-btn btn-arcade py-2.5 px-2 rounded-lg bg-[#161925] border border-[#252a3d] text-xs sm:text-sm flex flex-col items-center gap-1">
            <svg class="w-5 h-4" viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8c2.5-6 5.5-6 8 0s5.5 6 8 0 2.5-4 4-4"/></svg>
            <span data-i18n="waveforms.sine"></span>
          </button>
          <button type="button" data-wave="triangle" class="wave-btn btn-arcade py-2.5 px-2 rounded-lg bg-[#161925] border border-[#252a3d] text-xs sm:text-sm flex flex-col items-center gap-1">
            <svg class="w-5 h-4" viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12L7 4l5 8 5-8 5 8"/></svg>
            <span data-i18n="waveforms.triangle"></span>
          </button>
          <button type="button" data-wave="noise" class="wave-btn btn-arcade py-2.5 px-2 rounded-lg bg-[#161925] border border-[#252a3d] text-xs sm:text-sm flex flex-col items-center gap-1">
            <svg class="w-5 h-4" viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9l2-5 2 9 2-7 2 6 2-8 2 9 2-6 2 5 2-4"/></svg>
            <span data-i18n="waveforms.noise"></span>
          </button>
        </div>
      </section>

      <!-- Recent History -->
      <section class="bg-[#11131c] border border-[#1e2233] rounded-xl p-4 sm:p-5 flex flex-col gap-3.5">
        <h2 class="font-mono-tech text-xs sm:text-sm font-bold tracking-wider text-emerald-400" data-i18n="sections.history"></h2>
        <div id="history-container" class="flex flex-col gap-2 max-h-56 overflow-y-auto"></div>
      </section>
    </aside>

    <!-- Right Column: Modular Synth Controls -->
    <section id="controls-container" class="lg:col-span-8 grid grid-cols-1 md:grid-cols-2 gap-5 content-start"></section>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
